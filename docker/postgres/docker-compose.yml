version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: taskapp_postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # optional seed
    networks:
      - taskapp-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: taskapp_pgadmin
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskapp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - taskapp-network
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: taskapp_redis
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password_change_in_production}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_password_change_in_production}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password_change_in_production}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  taskapp-network:

volumes:
  postgres_data:
  redis_data:
  