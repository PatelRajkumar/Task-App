spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8    # Maximum connections in pool
          max-idle: 8      # Maximum idle connections
          min-idle: 2      # Minimum idle connections
          max-wait: 2000ms # Max time to wait for connection
        shutdown-timeout: 100ms
  cache:
    type: redis
    redis:
      time-to-live: 300000       # Default TTL: 5 minutes (milliseconds)
      cache-null-values: false   # Don't cache null values
      use-key-prefix: true       # Add prefix to all keys
      key-prefix: "taskapp::"    # Namespace for multi-app Redis

  jpa:
    hibernate:
      ddl-auto: validate  # IMPORTANT: Change from 'update' to 'validate'
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    sql-migration-suffixes: .sql
    validate-on-migrate: true
    out-of-order: false

  security:
    require-ssl: false


# ========== AWS S3 Configuration ==========
aws:
  s3:
    # Use your AWS region (check your bucket region)
    region: ${AWS_REGION}
    bucket-name: ${AWS_BUCKET_NAME}
    # Access key from IAM user (use env variable in production)
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    # S3 endpoint (use for localstack testing, optional)
    # endpoint-override: ${AWS_ENDPOINT_OVERRIDE:} # Leave empty for AWS, set for localstack
    endpoint-override: "" # Leave empty for AWS, set for localstack
    path-style-access: true
    # Cache file URLs for 1 hour (presigned URL expiration)
    presigned-url-expiration-hours: 1

# ========== File Upload Configuration ==========
app:
  file-upload:
    # Local fallback storage (dev/testing)
    local-storage-path: ./uploads
    # Maximum file size: 50 MB (in bytes)
    max-file-size: 52428800
    # Allowed MIME types (comma-separated)
    allowed-mime-types: image/jpeg,image/png,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,text/csv
    # Storage type: local or s3
    storage-type: s3
    # Scan files for viruses (optional, requires ClamAV)
    virus-scanning-enabled: false
    # Path prefix in S3 bucket
    s3-path-prefix: attachments/
    # Auto-delete files after days (0 = disabled)
    auto-delete-after-days: 90

# Logging Configuration (add to existing section)
logging:
  level:
    org.springframework.cache: DEBUG          # NEW: Cache operation logging
    org.springframework.data.redis: DEBUG     # NEW: Redis connection logging
    com.pm.taskapp: DEBUG
    org.hibernate.SQL: DEBUG
    # ... rest of existing logging config
