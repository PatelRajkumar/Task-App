spring.application.name=TaskApp

spring.profiles.active=dev


spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# DDL auto (create, create-drop, update, validate, none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# === App Auth Configuration ===
app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-alg=HS256
app.auth.jwt-expiration-ms=3600000
app.auth.refresh-token-expiration-days=30
app.auth.max-refresh-tokens-per-user=5
app.auth.token-cleanup-cron=0 0 2 * * ?
app.auth.password-reset-token-expiration-ms=3600000
app.auth.email-verification-token-expiration-ms=86400000
app.auth.max-failed-attempts=5
app.auth.lockout-duration-minutes=30

# === App Mail Configuration ===
app.mail.base-url=http://localhost:8080
app.mail.support-email=support@taskapp.com

# SES SMTP
spring.mail.host=email-smtp.eu-north-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*

# Default from address (verified)
app.mail.from=${MAIL_FROM}

#jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'


#cors 
cors.allowed-origins[0]=http://localhost:3000
cors.allowed-origins[1]=http://localhost:4200
cors.allowed-origins[2]=http://localhost:8080

cors.allowed-methods[0]=GET
cors.allowed-methods[1]=POST
cors.allowed-methods[2]=PUT
cors.allowed-methods[3]=DELETE
cors.allowed-methods[4]=PATCH
cors.allowed-methods[5]=OPTIONS

cors.allowed-headers[0]=Authorization
cors.allowed-headers[1]=Content-Type
cors.allowed-headers[2]=X-Requested-With

cors.allow-credentials=true
cors.max-age=3600

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

server.compression.enabled=true
server.compression.mime-types[0]=application/json
server.compression.mime-types[1]=application/xml
server.compression.mime-types[2]=text/html
server.compression.mime-types[3]=text/xml
server.compression.mime-types[4]=text/plain

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false

# Actuator Configuration

# Exposed endpoints
management.endpoints.web.exposure.include[0]=health
management.endpoints.web.exposure.include[1]=info
management.endpoints.web.exposure.include[2]=metrics
management.endpoints.web.exposure.include[3]=prometheus

management.endpoints.web.base-path=/actuator

# Health endpoint
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Metrics / Prometheus export
management.metrics.export.prometheus.enabled=true

# Disable mail health indicator
management.health.mail.enabled=false


# Logging Levels
logging.level.root=INFO
logging.level.com.pm.taskapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log File Config
logging.file.name=logs/taskapp.log
logging.file.max-size=10MB
logging.file.max-history=30

# OpenAPI Docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Swagger UI Config
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true

# API Path + Package Scanning
springdoc.paths-to-match[0]=/api/**
springdoc.packages-to-scan[0]=com.pm.taskapp.auth.controller
springdoc.packages-to-scan[1]=com.pm.taskapp.project.controller
springdoc.packages-to-scan[2]=com.pm.taskapp.task.controller
springdoc.packages-to-scan[3]=com.pm.taskapp.comments.controller
springdoc.packages-to-scan[4]=com.pm.taskapp.attachment.controller

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=/tmp



